name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dio: ^5.9.2
  image_picker: ^1.2.2

  # L'export del calendario in PDF. Puro Dart, nessun plugin nativo: il
  # documento è costruito dal browser con la stessa logica di dominio che
  # disegna il calendario a schermo, e `web` serve solo ad aprire la scheda che
  # lo mostra.
  pdf: ^3.13.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    # Sotto `assets` e non sotto `fonts`: non è una famiglia di testo dell'app —
    # che prende il suo Plus Jakarta Sans da google_fonts — ma tre file che solo
    # l'export legge, con rootBundle, la prima volta che qualcuno stampa.
    - assets/fonts/
    - ../backend/.env