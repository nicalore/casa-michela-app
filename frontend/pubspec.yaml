name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dio: ^5.9.2
  image_picker: ^1.2.2

  # L'export del calendario in PDF. Puro Dart, nessun plugin nativo: il
  # documento è costruito dal browser con la stessa logica di dominio che
  # disegna il calendario a schermo, e `web` serve solo ad aprire la scheda che
  # lo mostra.
  pdf: ^3.13.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    # Anche fra gli `assets`, e non solo sotto `fonts`: l'export PDF li legge con
    # rootBundle la prima volta che qualcuno stampa, e google_fonts li ritrova
    # nel manifest, così i pesi presenti qui non passano dalla rete.
    - assets/fonts/
    - ../backend/.env

  # La famiglia registrata dal motore prima del primo frame, con ogni variante
  # che l'app chiede: nessuna arriva più dalla rete a pagina già disegnata. Il
  # nome senza spazi è quello che google_fonts mette in ogni fontFamilyFallback,
  # quindi anche un peso che dovesse sfuggire cade qui, sul carattere giusto,
  # invece che sul ripiego del motore — più alto e più stretto, quello che si
  # vedeva comparire per un attimo negli hint dei dialog.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic