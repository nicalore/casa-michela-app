<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="<Associazione Casa Michela>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Associazione Casa Michela</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #flutter-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    #flutter-scale-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      will-change: transform;
    }
  </style>

  <script>
    window.__casaMichelaConfig = {
      phoneDprMultiplier:  1,   // moltiplicatore DPR per i telefoni
      tabletDprMultiplier: 1.1,   // moltiplicatore DPR per i tablet (più conservativo, schermo già grande)
      maxForcedDpr:        6,   // tetto di sicurezza assoluto, qualunque dispositivo
      phoneMaxZoom:        4,   // zoom massimo pinch su telefono
      tabletMaxZoom:       2    // zoom massimo pinch su tablet (più conservativo, sfocatura meno percettibile)
    };

    // --- Rilevamento tablet vs telefono in più passi, dal più affidabile al più approssimativo ---
    function detectIsTablet() {
      var ua = (navigator.userAgent || '').toLowerCase();
      var maxTouchPoints = navigator.maxTouchPoints || 0;

      // 1. Match esplicito di tablet noti
      if (/ipad/.test(ua))      { return true; }
      if (/tablet/.test(ua))    { return true; }
      if (/playbook/.test(ua))  { return true; }
      if (/silk/.test(ua))      { return true; } // Kindle Fire

      // 2. Caso speciale iPad recenti (iPadOS 13+): si dichiarano "Macintosh" ma hanno touch multipunto.
      //    Un Mac vero non ha touch screen, quindi questa combinazione è quasi certamente un iPad.
      if (/macintosh/.test(ua) && maxTouchPoints > 1) { return true; }

      // 3. Match esplicito di telefoni: "Mobile" senza "Tablet" è quasi sempre un telefono
      if (/mobile/.test(ua) && !/tablet/.test(ua)) { return false; }
      if (/iphone/.test(ua))                       { return false; }
      if (/ipod/.test(ua))                         { return false; }

      // 4. Fallback dimensionale per casi ambigui (es. WebView non standard, browser sconosciuti):
      //    stima la diagonale fisica con una soglia conservativa di 7.5 pollici.
      var dpr = window.devicePixelRatio || 1;
      var physicalWidthPx = screen.width * dpr;
      var physicalHeightPx = screen.height * dpr;
      var assumedPpi = 401;
      var widthInches = physicalWidthPx / assumedPpi;
      var heightInches = physicalHeightPx / assumedPpi;
      var diagonal = Math.sqrt(widthInches * widthInches + heightInches * heightInches);

      return diagonal >= 7.5;
    }

    window.__casaMichelaIsTablet = detectIsTablet();

    // --- Override del devicePixelRatio una volta sola, PRIMA del bootstrap Flutter ---
    (function () {
      var cfg = window.__casaMichelaConfig;
      var multiplier = window.__casaMichelaIsTablet ? cfg.tabletDprMultiplier : cfg.phoneDprMultiplier;

      if (multiplier <= 1) { return; }

      var nativeDpr = window.devicePixelRatio || 1;
      var forcedDpr = Math.min(nativeDpr * multiplier, cfg.maxForcedDpr);

      try {
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () { return forcedDpr; }
        });
      } catch (e) {
        //Fallback: nessuna nitidezza extra
      }
    })();
  </script>
</head>
<body>
  <div id="flutter-viewport">
    <div id="flutter-scale-wrapper">
      <div id="flutter_host"></div>
    </div>
  </div>

  <script>
    (function () {
      var DESKTOP_WIDTH = 1024;
      var MIN_USER_ZOOM = 1;
      var PAN_THRESHOLD = 12;
      var MOMENTUM_FRICTION = 0.95;
      var MOMENTUM_MIN_VELOCITY = 0.02;

      var cfg = window.__casaMichelaConfig;
      var MAX_USER_ZOOM = window.__casaMichelaIsTablet ? cfg.tabletMaxZoom : cfg.phoneMaxZoom;

      var host = document.getElementById('flutter_host');
      var wrapper = document.getElementById('flutter-scale-wrapper');
      var viewport = document.getElementById('flutter-viewport');

      var baseScale = 1;
      var userZoom = 1;
      var panX = 0;
      var panY = 0;

      function totalScale() {
        return baseScale * userZoom;
      }

      function applyTransform() {
        wrapper.style.transform =
          'translate(' + panX + 'px,' + panY + 'px) scale(' + totalScale() + ')';
      }

      function clampPan() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var s = totalScale();
        var contentWidth = DESKTOP_WIDTH * s;
        var contentHeight = parseFloat(host.style.height || 0) * s;
        var minX = Math.min(0, vw - contentWidth);
        var minY = Math.min(0, vh - contentHeight);
        panX = Math.max(minX, Math.min(0, panX));
        panY = Math.max(minY, Math.min(0, panY));
      }

      var pinchActive = false;
      var pinchStartDistance = 0;
      var pinchStartZoom = 1;
      var pinchContentX = 0;
      var pinchContentY = 0;

      var singleTouchId = null;
      var singleStart = { x: 0, y: 0 };
      var singleStartPan = { x: 0, y: 0 };
      var singlePanClaimed = false;

      var velocityX = 0;
      var velocityY = 0;
      var lastSampleTime = 0;
      var lastSampleX = 0;
      var lastSampleY = 0;
      var momentumRAF = null;

      function cancelMomentum() {
        if (momentumRAF !== null) {
          cancelAnimationFrame(momentumRAF);
          momentumRAF = null;
        }
      }

      function startMomentum() {
        cancelMomentum();
        var lastTime = performance.now();

        function step(now) {
          var dt = now - lastTime;
          lastTime = now;
          var friction = Math.pow(MOMENTUM_FRICTION, dt / 16);
          velocityX *= friction;
          velocityY *= friction;

          panX += velocityX * dt;
          panY += velocityY * dt;
          clampPan();
          applyTransform();

          if (Math.abs(velocityX) > MOMENTUM_MIN_VELOCITY || Math.abs(velocityY) > MOMENTUM_MIN_VELOCITY) {
            momentumRAF = requestAnimationFrame(step);
          } else {
            momentumRAF = null;
          }
        }

        momentumRAF = requestAnimationFrame(step);
      }

      function trackVelocitySample(t) {
        var now = performance.now();
        var dt = now - lastSampleTime;
        if (dt > 0 && lastSampleTime > 0) {
          var instVX = (t.clientX - lastSampleX) / dt;
          var instVY = (t.clientY - lastSampleY) / dt;
          velocityX = velocityX * 0.7 + instVX * 0.3;
          velocityY = velocityY * 0.7 + instVY * 0.3;
        }
        lastSampleTime = now;
        lastSampleX = t.clientX;
        lastSampleY = t.clientY;
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw >= DESKTOP_WIDTH) {
          baseScale = 1;
          host.style.width = vw + 'px';
          host.style.height = vh + 'px';
        } else {
          baseScale = vw / DESKTOP_WIDTH;
          host.style.width = DESKTOP_WIDTH + 'px';
          host.style.height = (vh / baseScale) + 'px';
        }

        userZoom = 1;
        panX = 0;
        panY = 0;
        pinchActive = false;
        singleTouchId = null;
        singlePanClaimed = false;
        cancelMomentum();
        applyTransform();
      }

      function dist(a, b) {
        var dx = a.clientX - b.clientX;
        var dy = a.clientY - b.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function startPinch(t1, t2) {
        pinchActive = true;
        pinchStartDistance = dist(t1, t2);
        pinchStartZoom = userZoom;
        var midX = (t1.clientX + t2.clientX) / 2;
        var midY = (t1.clientY + t2.clientY) / 2;
        var s = totalScale();
        pinchContentX = (midX - panX) / s;
        pinchContentY = (midY - panY) / s;
        singleTouchId = null;
        singlePanClaimed = false;
      }

      viewport.addEventListener('touchstart', function (e) {
        cancelMomentum();

        if (e.touches.length === 2) {
          startPinch(e.touches[0], e.touches[1]);
          e.preventDefault();
        } else if (e.touches.length === 1 && userZoom > 1.02) {
          var t = e.touches[0];
          singleTouchId = t.identifier;
          singleStart = { x: t.clientX, y: t.clientY };
          singleStartPan = { x: panX, y: panY };
          singlePanClaimed = false;
          velocityX = 0;
          velocityY = 0;
          lastSampleTime = 0;
          trackVelocitySample(t);
        }
      }, { capture: true, passive: false });

      viewport.addEventListener('touchmove', function (e) {
        if (e.touches.length === 2 && pinchActive) {
          var t1 = e.touches[0], t2 = e.touches[1];
          var ratio = dist(t1, t2) / pinchStartDistance;
          userZoom = Math.max(MIN_USER_ZOOM, Math.min(MAX_USER_ZOOM, pinchStartZoom * ratio));

          var midX = (t1.clientX + t2.clientX) / 2;
          var midY = (t1.clientY + t2.clientY) / 2;
          var s = totalScale();
          panX = midX - pinchContentX * s;
          panY = midY - pinchContentY * s;

          clampPan();
          applyTransform();
          e.preventDefault();
          e.stopPropagation();
          return;
        }

        if (e.touches.length === 1 && singleTouchId !== null) {
          var t = e.touches[0];
          if (t.identifier !== singleTouchId) { return; }

          trackVelocitySample(t);

          var dx = t.clientX - singleStart.x;
          var dy = t.clientY - singleStart.y;

          if (!singlePanClaimed) {
            if (Math.sqrt(dx * dx + dy * dy) <= PAN_THRESHOLD) {
              return;
            }
            singlePanClaimed = true;
          }

          panX = singleStartPan.x + dx;
          panY = singleStartPan.y + dy;
          clampPan();
          applyTransform();
          e.preventDefault();
          e.stopPropagation();
        }
      }, { capture: true, passive: false });

      viewport.addEventListener('touchend', function (e) {
        if (pinchActive && e.touches.length === 1) {
          pinchActive = false;
          var t = e.touches[0];
          singleTouchId = t.identifier;
          singleStart = { x: t.clientX, y: t.clientY };
          singleStartPan = { x: panX, y: panY };
          singlePanClaimed = true;
          velocityX = 0;
          velocityY = 0;
          lastSampleTime = 0;
          trackVelocitySample(t);
          return;
        }

        if (e.touches.length === 0) {
          if (singlePanClaimed) {
            startMomentum();
          }
          pinchActive = false;
          singleTouchId = null;
          singlePanClaimed = false;
        }
      }, { capture: true });

      viewport.addEventListener('touchcancel', function () {
        pinchActive = false;
        singleTouchId = null;
        singlePanClaimed = false;
        cancelMomentum();
      }, { capture: true });

      layout();
      window.addEventListener('resize', layout);
      window.addEventListener('orientationchange', layout);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
